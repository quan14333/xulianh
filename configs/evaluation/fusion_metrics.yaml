schema_version: 1
evaluation:
  metrics:
    - EN
    - SD
    - SCD
    - MS_SSIM
    - Q_ABF
    - SF
    - AG
    - edge_corr
  input_channel: Y
  require_matching_ids: true
  require_matching_shapes: true
  cast_before_subtraction: float64
  ms_ssim_aggregation: mean
  data_range: 255.0
reporting:
  statistics:
    - mean
    - std
    - median
    - valid_count
  paired_comparison: true
validation_status:
  EN: verified
  SD: verified
  SCD: verified
  MS_SSIM: verified
  Q_ABF: verified
  SF: verified
  AG: verified
  edge_corr: verified
